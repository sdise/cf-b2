# =============================================================
# cf-b2-worker · Wrangler 配置
# 部署：npx wrangler deploy
# 本地：npx wrangler dev
# 密钥类变量不要写在这里，用 `npx wrangler secret put XXX` 设置
# =============================================================

name = "cf-b2-worker"
main = "src/b2-worker.js"
compatibility_date = "2024-11-01"

# ---------- 自定义域名 / 路由（三选一，按需打开）----------
# 方式 A：Workers 的 workers.dev 子域（默认就有，无需配置）
workers_dev = true

# 方式 B：Cloudflare 托管域名上的自定义子域（推荐，会自动创建 DNS 记录）
# [[routes]]
# pattern = "dl.example.com"
# custom_domain = true

# 方式 C：已有 DNS 记录的路由匹配
# [[routes]]
# pattern = "dl.example.com/*"
# zone_name = "example.com"

# ---------- 明文环境变量（非敏感）----------
[vars]
# Backblaze B2 的 S3 兼容端点，请换成你自己桶的 Endpoint（B2 控制台桶详情页可见）
B2_ENDPOINT = "https://s3.us-west-001.backblazeb2.com"

# 桶名。三种取值：
#   "your-bucket"   固定桶（推荐）
#   "$path"         由 URL 第一段决定桶名：https://host/<bucket>/<key>
#   "$host"         由主机名第一段决定桶名：https://<bucket>.host/<key>
BUCKET_NAME = "your-bucket-name"

# 路径样式：path（推荐，兼容性最好）| virtual（<bucket>.s3.xxx.backblazeb2.com）
URL_STYLE = "path"

# 是否允许匿名读取对象
PUBLIC_READ = "true"

# 匿名只读目录（公开分享目录）：未登录用户只能下载该前缀下的文件，
# 其余 key 一律 403；访问根路径会自动 302 跳到这里
# 留空表示不做前缀限制（整桶匿名可读）
PUBLIC_PREFIX = "share"

# 是否允许匿名列举 PUBLIC_PREFIX 目录（做成公开目录索引）
PUBLIC_LIST = "true"

# 是否允许匿名列举任意目录（关闭后，匿名只能看 PUBLIC_PREFIX 内的列表）
ALLOW_LIST_BUCKET = "false"

# 是否开启写 / 删 / Web 管理器
ENABLE_WRITE = "true"
ENABLE_DELETE = "true"
ENABLE_MANAGE = "true"

# 匿名访问无权查看的目录时的响应：
#   welcome  = 渲染引导页（推荐，访客友好的用法说明）
#   redirect = 302 跳到 /__manage（会弹出 Basic 登录框）
#   deny     = 返回 403 JSON
# 注意：访问根路径时，若 PUBLIC_PREFIX 非空，优先 302 到 /<PUBLIC_PREFIX>/
ROOT_ACTION = "welcome"

# 边缘缓存：0 表示不缓存
CACHE_MAX_AGE = "86400"
ENABLE_CACHE = "true"

# 「Worker 代理」单请求上限（字节）。Workers 请求体硬上限是十进制 100MB，
# 这里默认留 4MB 余量；超过该值的文件会自动改为并发分片经 Worker 转发。
MAX_UPLOAD_BYTES = "96000000"

# 「直传」超过该体积自动改为并发分片（字节）。
# 实测 B2 对单次 PUT 的上限是 100MiB（104857600 字节），达到/超过会被上游中断
# （返回 500 InternalError，浏览器表现为 CORS Failed），因此这里默认 100000000
# 并在代码里强制钳制 < 104857600。
MULTIPART_THRESHOLD = "100000000"

# 分片上传的并发数（1-10，默认 3），直传与 Worker 代理都适用
UPLOAD_CONCURRENCY = "3"

# 预签名 URL 有效期（秒）。仅用于「上传直传」；下载直链已强制禁用，必须经 Worker
PRESIGN_EXPIRES = "3600"

# 分片大小（字节）。仅「Worker 代理」路径使用（直传不分片）。
# B2 要求除最后一片外 ≥5MB；前端会自动取 min(此值, MAX_UPLOAD_BYTES-1MB)
MULTIPART_PART_SIZE = "26214400"

# CORS 允许的 Origin，逗号分隔；* 表示全部（直传时需要包含你的站点域名）
ALLOWED_ORIGINS = "*"

# 上传时写入对象的 Cache-Control（留空表示不设置，使用 B2 桶默认）
# UPLOAD_CACHE_CONTROL = "public, max-age=31536000, immutable"

# 兼容 rclone --b2-download-url（去掉 URL 中 file/<bucket>/ 前缀）
RCLONE_DOWNLOAD = "false"

# 匿名信息收敛：隐藏桶名/区域，且对匿名请求隐藏上游错误正文（强烈建议保持 true）
HIDE_BUCKET_INFO = "true"

# 剥离 B2/S3 内部响应头（x-bz-*、x-amz-request-id、x-amz-version-id 等）
STRIP_UPSTREAM_META = "true"

# 隐藏目录占位对象 <prefix>/.keep（新建目录时会写入 0 字节占位），
# 目录页与管理器列表都不显示，并同步修正"N 个文件"的计数
HIDE_KEEP_FILES = "true"

# ---------------------------------------------------------------------------
# B2 用量面板（管理页顶部卡片）
# ---------------------------------------------------------------------------
# 背景：Backblaze 没有公开的「空间 / 事务次数」查询 API，因此：
#   · 空间 = 遍历 ListObjectsV2 累加（每 1000 对象消耗 1 次 Class C，只算 current 版本）
#   · 次数 = 本 Worker 自己按 B2 事务类别计数（存 Cache API，UTC 每日 00:00 归零）
ENABLE_USAGE_PANEL = "true"

# 「总空间」基准，默认按 B2 免费额度 10 GB（十进制）；改成 0 则不显示比例
STORAGE_QUOTA_BYTES = "10000000000"

# 空间统计结果缓存时长（秒），默认 6 小时；打开页面只读缓存，不触发回源
USAGE_CACHE_TTL = "21600"

# 手动点「重新统计」的最小间隔（秒），默认 5 分钟
USAGE_MIN_INTERVAL = "300"

# 单次扫描最多翻页数（1 页 = 1000 个对象 = 1 次 Class C），默认 20 页 = 2 万对象
USAGE_SCAN_MAX_PAGES = "20"

# 每日额度（免费账户 Class B / Class C 各 2500 次/天，按你账户实际套餐调整）
CLASS_B_DAILY_QUOTA = "2500"
CLASS_C_DAILY_QUOTA = "2500"

# 惰性窗口：UTC 进入该小时后，当天第一次打开用量面板会强制重扫一次空间
# 默认 23 = 在 B2 计数器 00:00 GMT 归零前一小时拿到「当日终值」；-1 关闭
USAGE_REFRESH_AT_UTC_HOUR = "23"

# DO 计数每累计多少批才落盘（1 = 每批都写，最精确）
# 免费计划 SQLite 行写入额度 10 万/天，提高该值可省额度（代价：DO 被驱逐时最多丢 N 批）
USAGE_DO_WRITE_EVERY = "1"

# 调试模式：出错时返回详细堆栈（生产环境请保持 false）
DEBUG = "false"

# ---------- 以下为密钥，禁止写进本文件 ----------
# 用命令行设置：
#   npx wrangler secret put B2_KEY_ID              # keyID / applicationKeyId
#   npx wrangler secret put B2_APPLICATION_KEY     # applicationKey
#   npx wrangler secret put ADMIN_PASS             # 管理口令（Basic）
#   npx wrangler secret put ADMIN_TOKEN            # 管理令牌（Bearer，二选一）

# ---------------------------------------------------------------------------
# Durable Objects：用量计数器（全局单实例 → 所有地区看到同一份数字；原子累加）
#
# 注意：TOML 的表会一直延伸到下一个表头，所以这些「表」必须放在所有 [vars] 之后，
#       否则后面的 key 会被算进 migrations 表里。
#
# 未绑定也能跑：代码会自动退化到 Cache API（面板显示"计数后端：Cache API"），
# 只是数字按数据中心分裂。免费计划只支持 SQLite 后端，故用 new_sqlite_classes。
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "USAGE_DO"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]
