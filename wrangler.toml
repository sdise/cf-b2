# =============================================================================
# cf-b2-worker · Wrangler 配置（对控制台友好版：变量全部沿用控制台）
#
# 部署：npx wrangler deploy --name <你的 Worker 名>
# 本地：npx wrangler dev           （变量从 .dev.vars 读，模板见 .dev.vars.example）
#
# -----------------------------------------------------------------------------
# ⚠️ 一、wrangler 部署对变量的覆盖规则（Cloudflare 官方语义）
#
#   · 明文变量（控制台里标 Text 的 vars）：
#       默认 wrangler 会「先清空该 Worker 上所有明文变量，再写入配置文件里的」。
#       ⇒ 控制台上手动加/改的明文变量会被覆盖甚至删除。
#   · 密钥（控制台上标 Secret，或用 wrangler secret put 建的）：
#       官方原文："Secrets are never deleted by a deployment whether this flag is
#       true or false." ⇒ 部署永远不会删除或覆盖密钥。
#   · keep_vars = true：保留「配置文件里没有的」变量（同名项仍以配置文件为准）。
#
#   本文件已按「对控制台友好」配置：
#       ① keep_vars = true
#       ② [vars] 整段注释掉 ⇒ 部署不上传任何明文变量
#     结果：部署不会改动你控制台里的任何变量，全部沿用控制台的值。
#     代码里每个变量都有默认值（见 src/b2-worker.js 的 loadConfig），
#     控制台漏配哪一项就用默认值，不会因此崩溃。
#
#   想改成「以配置文件为准」：取消下面 [vars] 的注释并填真实值即可
#     （同名项会覆盖控制台；未在文件里出现的控制台变量仍被 keep_vars 保留）。
#   想反过来「部署时清掉控制台多余变量」：把 keep_vars 改成 false。
# -----------------------------------------------------------------------------
# ⚠️ 二、name 决定「更新哪个 Worker」，写错会新建一个 Worker 而不是更新现有的
#
#   你线上的是 b2 ⇒ 部署请用：npx wrangler deploy --name b2
#   （或直接把下面的 name 改成 "b2"）
# -----------------------------------------------------------------------------
# =============================================================================

name = "cf-b2-worker"
main = "src/b2-worker.js"
compatibility_date = "2024-11-01"

# 保留控制台上已有的明文变量（不因部署被清空/覆盖）——本文件的「对控制台友好」开关
keep_vars = true

# ---------- 多桶挂载表（BUCKET_1..N）放哪？----------
# ⚠️ 不要写进本文件（会被 git 提交，泄漏 B2 密钥）。正确做法：
#   · 本地开发（wrangler dev）：自动读 .dev.vars（已被 .gitignore 忽略）
#   · 部署到 Worker：node deploy.mjs —— 从 .dev.vars 读 BUCKET_N，经 --var 传给 wrangler，
#     keep_vars=true 保证控制台里其它变量不受影响
# 每个 BUCKET_N 的值是一个 JSON：
#   BUCKET_1={"BUCKET_NAME":"桶名","KEY_ID":"keyID","APPLICATION_KEY":"appKey","ENDPOINT":"https://s3.xx-nnn.backblazeb2.com"}

# ---------- 自定义域名 / 路由 ----------
# 路由由控制台管理时，保持下面 routes 全部注释：wrangler 不会去覆盖控制台的路由。
workers_dev = true

# 方式 B：Cloudflare 托管域名上的自定义子域（会自动创建 DNS 记录）
# [[routes]]
# pattern = "dl.example.com"
# custom_domain = true

# 方式 C：已有 DNS 记录的路由匹配
# [[routes]]
# pattern = "dl.example.com/*"
# zone_name = "example.com"

# =============================================================================
# 变量：[vars] 整段注释 = 全部交由控制台管理（Settings → Variables and Secrets）
#
# 新部署（控制台还是空的）请按下面清单在控制台补齐；
# 或取消注释直接写在这里（会成为配置文件的权威值）。
# 带 ★ 的是「不配就跑不起来」的必需项。
# =============================================================================
# [vars]
# ★ B2_ENDPOINT = "https://s3.us-west-001.backblazeb2.com"   # 换成你桶的 S3 端点，如 https://s3.us-east-005.backblazeb2.com
# ★ BUCKET_NAME = "your-bucket-name"                          # 固定桶；或 "$path" / "$host"（见下）
#   URL_STYLE = "path"                                        # path（推荐）| virtual
#
#   # 桶名三种取值：
#   #   "your-bucket"  固定桶（推荐）
#   #   "$path"        由 URL 第一段决定桶名：https://host/<bucket>/<key>
#   #   "$host"        由主机名第一段决定桶名：https://<bucket>.host/<key>
#
#   # --- 访问控制 ---
#   PUBLIC_READ = "true"                  # 是否允许匿名读取对象
#   PUBLIC_PREFIX = "share"               # 匿名只读目录；留空 = 整桶匿名可读
#   PUBLIC_LIST = "true"                  # 是否允许匿名列举 PUBLIC_PREFIX
#   ALLOW_LIST_BUCKET = "false"           # 是否允许匿名列举任意目录（建议 false）
#   ENABLE_WRITE = "true"
#   ENABLE_DELETE = "true"
#   ENABLE_MANAGE = "true"                # /__manage 管理器
#   ROOT_ACTION = "welcome"               # 匿名访问无权目录时：welcome | redirect | deny
#   ALLOWED_ORIGINS = "*"                 # CORS，逗号分隔
#
#   # --- 缓存 ---
#   CACHE_MAX_AGE = "86400"
#   ENABLE_CACHE = "true"
#
#   # --- 上传 ---
#   MAX_UPLOAD_BYTES = "96000000"         # Worker 代理单请求上限（Workers 硬上限是十进制 100MB）
#   MULTIPART_THRESHOLD = "100000000"     # 直传超过此值自动分片（实测 B2 单次 PUT 上限 100MiB）
#   UPLOAD_CONCURRENCY = "3"              # 分片并发（1-10）
#   MULTIPART_PART_SIZE = "26214400"      # 分片大小（字节）
#   PRESIGN_EXPIRES = "3600"              # 预签名有效期（秒）
#   # UPLOAD_CACHE_CONTROL = "public, max-age=31536000, immutable"
#
#   # --- 隐私 / 兼容 ---
#   HIDE_BUCKET_INFO = "true"             # 匿名隐藏桶名/区域、隐藏上游错误正文
#   STRIP_UPSTREAM_META = "true"          # 剥离 x-bz-* / x-amz-request-id 等内部响应头
#   HIDE_KEEP_FILES = "true"              # 隐藏目录占位对象 <prefix>/.keep
#   RCLONE_DOWNLOAD = "false"             # 兼容 rclone --b2-download-url
#
#   # --- B2 用量面板（管理页左栏卡片；移动端置底）---
#   # 背景：Backblaze 没有公开的「空间 / 事务次数」查询 API，所以：
#   #   空间 = 遍历 ListObjectsV2 累加（每 1000 对象 1 次 Class C，只算 current 版本）
#   #   次数 = 本 Worker 自己按 B2 事务类别计数（DO 优先，未绑定则 Cache API）
#   ENABLE_USAGE_PANEL = "true"
#   STORAGE_QUOTA_BYTES = "10000000000"   # 「总空间」基准（十进制 10 GB）；0 = 不显示比例
#   USAGE_SCAN_MAX_PAGES = "20"           # 单次扫描最多页数（每页 1000 对象）
#   CLASS_B_DAILY_QUOTA = "2500"          # 仅用于算「剩余次数」
#   CLASS_C_DAILY_QUOTA = "2500"
#   USAGE_SCAN_HOURS = "23"               # scheduled() 里刷新空间快照的 UTC 小时
#   USAGE_RESET_HOURS = "23"              # scheduled() 里归零计数的 UTC 小时（默认与统计同点）
#   USAGE_AUTO_SCAN = "false"             # 是否允许"惰性自动扫描"（默认只由 Cron 触发）
#   USAGE_CACHE_TTL = "21600"             # 仅 USAGE_AUTO_SCAN=true 时用作过期判断
#   USAGE_REFRESH_AT_UTC_HOUR = "-1"      # 惰性窗口（默认关闭）
#   USAGE_SCHEDULE_BUCKETS = ""           # $path/$host 多桶模式必须显式列出，如 "bucket-a,bucket-b"
#   USAGE_DO_WRITE_EVERY = "1"            # DO 计数每累计多少批落盘（1 = 每批都写）
#
#   # --- 其它 ---
#   DEBUG = "false"
#
# 取值说明（USAGE_SCAN_HOURS / USAGE_RESET_HOURS）：小时逗号分隔（"23" / "11,23"）；
#   "*" = 每次触发都做；"-" = 从不。

# =============================================================================
# Cron Triggers：由控制台管理（保持注释 = wrangler 不接管，你控制台配的 cron 保留）
#
# 官方语义：把 crons 注释掉不会禁用已有 Cron Trigger；要清空必须显式写 crons = []。
# 你已在控制台配好：0 23 * * *（每天 23:00 UTC；同一次触发里先刷新空间快照、再归零计数）
#
# 若希望改由 wrangler 统一管理，取消下面注释，并保持与
# USAGE_SCAN_HOURS / USAGE_RESET_HOURS 一致（想 23 点统计 + 0 点归零就写两条）：
# [triggers]
# crons = ["0 23 * * *"]
# =============================================================================

# =============================================================================
# Durable Objects：用量计数器（一个桶一个实例 → 所有地区看到同一份数字；原子累加）
#
# 注意：TOML 的表会一直延伸到下一个表头，所以这张表要放在所有键值对之后。
# 未绑定也能跑：代码会自动降级到 Cache API（面板显示"计数后端：Cache API"），
# 只是数字按数据中心分裂。免费计划只支持 SQLite 后端，故用 new_sqlite_classes。
# =============================================================================
[[durable_objects.bindings]]
name = "USAGE_DO"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]

# =============================================================================
# 密钥：禁止写进本文件，用命令行或在控制台设置（类型选 Secret）
#   npx wrangler secret put B2_KEY_ID              # keyID / applicationKeyId
#   npx wrangler secret put B2_APPLICATION_KEY     # applicationKey
#   npx wrangler secret put ADMIN_USER             # 管理用户名（Basic），可放 vars
#   npx wrangler secret put ADMIN_PASS             # 管理口令（Basic）
#   npx wrangler secret put ADMIN_TOKEN            # 管理令牌（Bearer，与 Basic 二选一）
#
# 提示：部署不会删除密钥，但会把「明文变量」按要求同步/清理，所以密码类一律用 Secret。
# =============================================================================
